# OFFLINE EXAMPLE ONLY. Reserved addresses and fake credentials cannot connect.
# Stock URLTest shape for import tests; stable-failover is a proposed custom feature.
mode: rule
log-level: info
proxies:
  - name: RF2-Relay-example-01
    type: socks5
    server: 192.0.2.10
    port: 1080
  - name: RF2-Relay-example-02
    type: socks5
    server: 192.0.2.20
    port: 1080
  - name: IP1-example-01-HTTP
    type: http
    server: 198.51.100.10
    port: 6080
    username: EXAMPLE_ONLY
    password: NOT_A_REAL_PASSWORD
    dialer-proxy: RF2-Relay-example-01
  - name: IP1-example-02-S5
    type: socks5
    server: 198.51.100.10
    port: 6080
    username: EXAMPLE_ONLY
    password: NOT_A_REAL_PASSWORD
    dialer-proxy: RF2-Relay-example-02
proxy-groups:
  - name: IP1
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 120
    timeout: 3000
    tolerance: 80
    proxies:
      - IP1-example-01-HTTP
      - IP1-example-02-S5
rules:
  - MATCH,IP1
