# OFFLINE EXAMPLE ONLY. Reserved addresses and fake credentials cannot connect.
# Custom stable-failover requires FlClash URLTest Pro. Stock clients reject it.
mode: rule
log-level: info
proxies:
  - name: RF2-Relay-example-01
    type: socks5
    server: 192.0.2.10
    port: 1080
  - name: RF2-Relay-example-02
    type: socks5
    server: 192.0.2.20
    port: 1080
  - name: IP1-example-01-HTTP
    type: http
    server: 198.51.100.10
    port: 6080
    username: EXAMPLE_ONLY
    password: NOT_A_REAL_PASSWORD
    dialer-proxy: RF2-Relay-example-01
  - name: IP1-example-02-S5
    type: socks5
    server: 198.51.100.10
    port: 6080
    username: EXAMPLE_ONLY
    password: NOT_A_REAL_PASSWORD
    dialer-proxy: RF2-Relay-example-02
proxy-groups:
  - name: IP1
    type: stable-failover
    expected-exit: 203.0.113.10
    residential-endpoints:
      - 198.51.100.10:6080
    relay-airports:
      RF2-Relay-example-01: example-airport-a
      RF2-Relay-example-02: example-airport-b
    proxies:
      - IP1-example-01-HTTP
      - IP1-example-02-S5
rules:
  - MATCH,IP1
