name: Stability Android validation
on:
  push:
    branches: ['main', 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stability-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  RUSTUP_TOOLCHAIN: '1.98.1'
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum
      - name: Go core and fault injection
        run: |
          cd core/Clash.Meta
          go test -race -count=1 ./component/stability ./adapter/outboundgroup
          go vet ./component/stability ./adapter/outboundgroup
          cd ..
          CGO_ENABLED=0 go test -count=1 .
          CGO_ENABLED=0 go vet .
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rust_api/rust
      - name: Android toolchain
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358'
          ndk_root="$ANDROID_HOME/ndk/28.2.13676358"
          test -x "$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          printf 'ANDROID_NDK_HOME=%s\nANDROID_NDK_ROOT=%s\n' "$ndk_root" "$ndk_root" >> "$GITHUB_ENV"
          rustup toolchain install 1.98.1 --profile minimal
          rustup target add aarch64-linux-android --toolchain 1.98.1
      - name: Flutter validation
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos > flutter-analysis.log 2>&1 || { sed 's/^/::error::/' flutter-analysis.log; exit 1; }
          cat flutter-analysis.log
          cp pubspec.yaml /tmp/pro-pubspec.yaml
          sed -i '0,/build_assets: true/s//build_assets: false/' pubspec.yaml
          flutter test test/widgets/proxies_stability_access_test.dart --reporter expanded > flutter-ui-smoke.log 2>&1 || { tail -100 flutter-ui-smoke.log | sed 's/^/::error::/'; exit 1; }
          cat flutter-ui-smoke.log
          flutter test test/widgets/ test/views/proxies_list_test.dart test/views/dashboard/ --reporter expanded
          cp /tmp/pro-pubspec.yaml pubspec.yaml
      - name: Build isolated arm64 test APK
        run: |
          printf '{"APP_ENV":"pre"}\n' > env.json
          flutter build apk --release --target-platform android-arm64 --dart-define-from-file=env.json
      - name: Native Android lifecycle checks
        run: |
          cd android
          ./gradlew :service:compileDebugKotlin :app:compileDebugKotlin :common:testDebugUnitTest :service:testDebugUnitTest :app:testDebugUnitTest -x :app:compileFlutterBuildDebug -x :app:copyFlutterAssetsDebug
      - name: Artifact provenance
        run: |
          mkdir -p build/pro-delivery
          cp build/app/outputs/flutter-apk/app-release.apk build/pro-delivery/FlClash-URLTest-Pro-arm64-test.apk
          sha256sum build/pro-delivery/*.apk > build/pro-delivery/SHA256SUMS.txt
          git rev-parse HEAD > build/pro-delivery/SOURCE_COMMIT.txt
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs build/pro-delivery/*.apk > build/pro-delivery/SIGNATURE.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: FlClash-URLTest-Pro-arm64-test
          path: build/pro-delivery/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stability-build-failure
          path: |
            .dart_tool/setup_build_cache/hook.log
            android/**/build/reports/tests/
