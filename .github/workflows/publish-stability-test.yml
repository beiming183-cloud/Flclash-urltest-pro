name: Publish verified stability test APK
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/publish-stability-test.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-stability-test-20261014
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_COMMIT: 'cb51ad277ec87fe41da32ff0712da65ff2c225e5'
      RELEASE_TAG: 'stability-pro-test-20261014-v3'
    steps:
      - name: Download and verify successful build artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/38499345176" > run.json
          gh api "repos/$GH_REPO/actions/artifacts/11865339090" > artifact.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('run.json'))
          artifact = json.load(open('artifact.json'))
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_sha'] == os.environ['SOURCE_COMMIT']
          assert not artifact['expired']
          assert artifact['name'] == 'FlClash-URLTest-Pro-arm64-test'
          assert artifact['digest'] == 'sha256:bf00d16579eacc1bc20bbf01f029277e7b224a5d56711a8cf5b9ee1447dd78c7'
          PY
          gh api "repos/$GH_REPO/actions/artifacts/11865339090/zip" > verified-artifact.zip
          python3 - <<'PY'
          import hashlib, os, pathlib, zipfile
          data = pathlib.Path('verified-artifact.zip').read_bytes()
          assert hashlib.sha256(data).hexdigest() == 'bf00d16579eacc1bc20bbf01f029277e7b224a5d56711a8cf5b9ee1447dd78c7'
          expected = {'FlClash-URLTest-Pro-arm64-test.apk', 'SHA256SUMS.txt', 'SIGNATURE.txt', 'SOURCE_COMMIT.txt'}
          out = pathlib.Path('delivery')
          out.mkdir()
          with zipfile.ZipFile('verified-artifact.zip') as archive:
              assert set(archive.namelist()) == expected and len(archive.infolist()) == 4
              for name in expected:
                  (out / name).write_bytes(archive.read(name))
          assert (out / 'SOURCE_COMMIT.txt').read_text().strip() == os.environ['SOURCE_COMMIT']
          checksum = (out / 'SHA256SUMS.txt').read_text().split()[0]
          apk = out / 'FlClash-URLTest-Pro-arm64-test.apk'
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == checksum
          (out / 'SHA256SUMS.txt').write_text(checksum + '  ' + apk.name + '\n')
          print('Verified APK bytes:', apk.stat().st_size)
          print('Verified APK SHA256:', checksum)
          PY
      - name: Publish mobile download release
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          Android arm64 原版操作保留版候选包。最新官方 FlClash v0.8.99 的首页、代理标签、节点卡片和一键测速逻辑逐项源码比对一致；界面回归、APK 编译与 Android 检查已通过，本机模拟器复测进行中。

          首页大面板已移除。代理页原有闪电测速、节点点选、搜索、排序和导航保留，只在右上角“更多”新增“住宅链路稳定模式”和“导出诊断”两个入口。稳定页只显示主用及两个在线备用，主用突出显示。

          私有 IP1 文件继续沿用；应用 ID：com.beiming.flclash.urltestpro.dev，build number：2026101403。测试签名不同，安装前保留原配置文件，卸载旧 URLTest Pro 测试版后重装；官方 FlClash 可保留。

          日志仍为 4 MiB 轮转，单次导出不超过 2 MiB。固定住宅出口和 TLS 验证保持开启，真实手机 ChatGPT SSL 尚未验收。

          源码：cb51ad277ec87fe41da32ff0712da65ff2c225e5；[通过的构建](https://github.com/beiming183-cloud/Flclash-urltest-pro/actions/runs/38499345176)。源码、签名与摘要文件附在 Assets。

          NOTES
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$SOURCE_COMMIT" --draft --prerelease --title 'FlClash URLTest Pro 原版操作保留 v3 · 待模拟器验收' --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" delivery/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --title 'FlClash URLTest Pro 原版操作保留 v3 · 待模拟器验收' --notes-file release-notes.md
          gh release view "$RELEASE_TAG" --json url,assets,isDraft,isPrerelease
