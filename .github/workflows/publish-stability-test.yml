name: Publish verified stability test APK
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/publish-stability-test.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-stability-test-20261014
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_COMMIT: 'd6592dc1e63da175da69b8d753a71a3df9cbddfb'
      RELEASE_TAG: 'stability-pro-test-20261014-v2'
    steps:
      - name: Download and verify successful build artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/38492440671" > run.json
          gh api "repos/$GH_REPO/actions/artifacts/11862392852" > artifact.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('run.json'))
          artifact = json.load(open('artifact.json'))
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_sha'] == os.environ['SOURCE_COMMIT']
          assert not artifact['expired']
          assert artifact['name'] == 'FlClash-URLTest-Pro-arm64-test'
          assert artifact['digest'] == 'sha256:1e5355471737f10e13e152e25258382256ccec94edee4a9d130042fa8b8d334e'
          PY
          gh api "repos/$GH_REPO/actions/artifacts/11862392852/zip" > verified-artifact.zip
          python3 - <<'PY'
          import hashlib, os, pathlib, zipfile
          data = pathlib.Path('verified-artifact.zip').read_bytes()
          assert hashlib.sha256(data).hexdigest() == '1e5355471737f10e13e152e25258382256ccec94edee4a9d130042fa8b8d334e'
          expected = {'FlClash-URLTest-Pro-arm64-test.apk', 'SHA256SUMS.txt', 'SIGNATURE.txt', 'SOURCE_COMMIT.txt'}
          out = pathlib.Path('delivery')
          out.mkdir()
          with zipfile.ZipFile('verified-artifact.zip') as archive:
              assert set(archive.namelist()) == expected and len(archive.infolist()) == 4
              for name in expected:
                  (out / name).write_bytes(archive.read(name))
          assert (out / 'SOURCE_COMMIT.txt').read_text().strip() == os.environ['SOURCE_COMMIT']
          checksum = (out / 'SHA256SUMS.txt').read_text().split()[0]
          apk = out / 'FlClash-URLTest-Pro-arm64-test.apk'
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == checksum
          (out / 'SHA256SUMS.txt').write_text(checksum + '  ' + apk.name + '\n')
          print('Verified APK bytes:', apk.stat().st_size)
          print('Verified APK SHA256:', checksum)
          PY
      - name: Publish mobile download release
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          Android arm64 修复候选包，云端原生测试、Flutter 回归、APK 编译及 Android 模块检查已通过；本机模拟器联网验收正在进行，本 Release 暂时标记为待验收。

          修复 StableFailover 的 IP1 候选页过滤问题，并允许已连接但未被 Android VALIDATED 标记的底层网络进行预算内检测。标准 TLS 与固定住宅出口校验保持开启。

          应用 ID：com.beiming.flclash.urltestpro.dev。使用原私有 IP1 stable-failover 配置。日志仍为 4 MiB 轮转，诊断导出不超过 2 MiB。

          源码：d6592dc1e63da175da69b8d753a71a3df9cbddfb；[已通过的构建](https://github.com/beiming183-cloud/Flclash-urltest-pro/actions/runs/38492440671)。校验文件与签名信息附在 Assets。真实手机 ChatGPT SSL 尚未验收。

          NOTES
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$SOURCE_COMMIT" --draft --prerelease --title 'FlClash URLTest Pro 修复候选 · 待模拟器验收' --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" delivery/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --notes-file release-notes.md
          gh release view "$RELEASE_TAG" --json url,assets,isDraft,isPrerelease
